name: deploy-ovh (ja2.virtastic.app)

# Deploys the JA2-WASM game to the OVH VPS via the self-hosted runner in the Virtastic org.
# The runner executes ON the VPS with docker access, so steps use docker / docker compose directly.
#
# Prereqs on the box: the shared `edge-caddy` container + `nostalgia` network, and
# /opt/edge/certs/virtastic.{crt,key} (the *.virtastic.app wildcard - already there for morrowind).
# The `ja2-builder:1` toolchain image is built on first run if missing (see the bootstrap step).
on:
  push:
    branches: [ovhcloud]
  workflow_dispatch:

concurrency:
  group: deploy-ovh-ja2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, ovh, virtastic]
    steps:
      - uses: actions/checkout@v4

      # Bootstrap the toolchain image once (emscripten 6.0.1 + Rust nightly). --network=host: rustup
      # + the wasm target download need egress the default build bridge lacks. Rebuild manually when
      # the pins in wasm-build/env.sh change: docker build --network=host -t ja2-builder:1 -f Dockerfile.builder .
      - name: Ensure builder image
        run: |
          docker image inspect ja2-builder:1 >/dev/null 2>&1 \
            || DOCKER_BUILDKIT=1 docker build --network=host -t ja2-builder:1 -f Dockerfile.builder .

      # Incremental JA2 build FROM the builder image. --network=host: cargo (build-std crate
      # downloads) + emscripten's SDL2 port need egress.
      - name: Build image
        run: DOCKER_BUILDKIT=1 docker build --network=host -t ja2:ovh -f Dockerfile .

      # Cloud Locker backend (small node image; no toolchain needed). Dormant until /opt/ja2/cloud.env
      # is filled (see cloud/.env.example) - it still builds and runs, serving /api/health.
      - name: Build cloud image
        run: DOCKER_BUILDKIT=1 docker build --network=host -t ja2-cloud:ovh -f cloud/Dockerfile cloud

      - name: Sync compose to /opt/ja2
        run: |
          sudo mkdir -p /opt/ja2
          sudo cp docker-compose.prod.yml /opt/ja2/docker-compose.prod.yml
          # env_file must exist or `compose up` fails; keep any operator-provided secrets untouched.
          sudo test -f /opt/ja2/cloud.env || sudo touch /opt/ja2/cloud.env

      # Drop the vhost into the shared edge's sites dir (imported by /opt/edge/Caddyfile).
      - name: Install edge vhost
        run: sudo cp deploy/ja2.caddy /opt/edge/sites/ja2.caddy

      - name: Start / update container
        run: docker compose -f /opt/ja2/docker-compose.prod.yml up -d

      # Validate, then restart the shared edge to apply (admin API is disabled, so `caddy reload`
      # can't be used - restart re-reads the Caddyfile; ~3s blip). Validate first to protect the
      # other sites on this edge.
      - name: Apply edge config
        run: |
          docker exec edge-caddy caddy validate --config /etc/caddy/Caddyfile
          docker restart edge-caddy

      # Health check on the shared network: 200 + cross-origin-isolation header present.
      - name: Health check
        run: |
          sleep 4
          docker run --rm --network nostalgia curlimages/curl:latest \
            -fsS -D - -o /dev/null http://ja2:80/ \
            | tee /dev/stderr | grep -qi '^cross-origin-opener-policy: same-origin'

      # OPTIONAL edge-cache purge. The engine is content-versioned: each build's ja2.{js,wasm,data}
      # are moved into a unique e/<hash>/ dir (see play/index.html + wasm-build/version-engine.sh),
      # so a new build is served at a fresh URL the CDN never cached - there is nothing stale to purge
      # (index.html itself is served no-store). This step exists only as belt-and-suspenders when the
      # shared org secret CLOUDFLARE_API_TOKEN is available to this repo; otherwise it's a clean no-op.
      # It purges the mutable HTML pointer by URL (plan-safe `files` - prefix/everything purges are
      # Enterprise-only / would clobber the shared zone). index.html is already no-store, so this is
      # purely belt-and-suspenders.
      - name: Purge Cloudflare cache (optional)
        continue-on-error: true
        env:
          CF_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: 875c5c671fa7e246307b9f70d56fc6e1   # virtastic.app zone id (not secret)
        run: |
          if [ -z "$CF_PURGE_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not available to this repo - skipping edge purge (optional: the engine is content-versioned, so nothing stale to purge)."
            exit 0
          fi
          resp=$(curl -sS -w '\n%{http_code}' -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_PURGE_TOKEN}" -H "Content-Type: application/json" \
            --data '{"files":[
              "https://ja2.virtastic.app/",
              "https://ja2.virtastic.app/index.html",
              "https://ja2.virtastic.app/launcher.html"
            ]}')
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          echo "$body"
          if [ "$code" = "200" ] && printf '%s' "$body" | grep -q '"success":true'; then
            echo "Edge cache purged for ja2.virtastic.app/."
          else
            echo "::notice::Optional Cloudflare purge did not succeed (HTTP $code) - harmless, the engine is content-versioned. Check the token's Cache Purge permission if you want this green."
          fi
