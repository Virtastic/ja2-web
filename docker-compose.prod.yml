# Production compose for ja2.virtastic.app - synced to /opt/ja2/ on the OVH VPS.
# The static-serving container plus the Cloud Locker backend, both joined to the shared `nostalgia`
# docker network; the shared edge Caddy reaches them by name (ja2:80, ja2-cloud:8080). Neither
# publishes host ports - only the edge talks to them. The static build hosts NO game data (upload-only).
services:
  ja2:
    image: ja2:ovh                  # built + tagged by the deploy workflow on the runner
    container_name: ja2
    restart: unless-stopped
    networks: [shared]

  # Cloud Locker: OAuth login + game-data/save sync (see cloud/). Two storage modes, by env:
  # with S3_* set, the browser transfers DIRECTLY to S3 via presigned URLs; with S3_* blank it
  # persists to the mounted /data volume and serves blobs itself (no object store needed).
  # Dormant until cloud.env exists (see cloud/.env.example); still serves /api/health meanwhile.
  ja2-cloud:
    image: ja2-cloud:ovh            # built + tagged by the deploy workflow on the runner
    container_name: ja2-cloud
    restart: unless-stopped
    env_file: [/opt/ja2/cloud.env]  # JWT_SECRET, then EITHER S3_* OR nothing (local /data), + <provider>_CLIENT_*
    volumes: [/opt/ja2/cloud-data:/data]   # local-storage mode: users' game data + saves live here
    networks: [shared]
    mem_limit: 512m

networks:
  shared:
    external: true
    name: nostalgia
