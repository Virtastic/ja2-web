# nginx config baked into the ja2-web image. Listens on plain HTTP:80; the shared
# reverse proxy (and Cloudflare) handle TLS. server_name is a catch-all because the proxy
# has already routed this request to this container by Host.
# Rate/concurrency zones for the Cloud Locker API (used by the /api/ location below). This file is
# included inside http{} (conf.d/default.conf), which is the required context for these directives.
# Keyed by client IP: a signed-in account is still just one IP's worth of upload capacity.
limit_req_zone  $binary_remote_addr zone=ja2_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=ja2_api_conn:10m;

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cross-origin isolation on EVERY response - this is why ja2-web needs its own server,
    # not a plain bucket. Set here so it survives regardless of the shared proxy's config.
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # Compress text at the origin. The engine artifacts are precompressed at image build
    # time (gzip -9 siblings, see Dockerfile) and served via gzip_static: Cloudflare passes
    # origin Content-Encoding through, and .data (octet-stream) is NOT edge-compressed, so
    # without this the 42 MB engine-data preload ships raw (compressed: ~11 MB; wasm ~3 MB).
    gzip on;
    gzip_types application/javascript text/css image/svg+xml; # text/html is gzipped by default
    gzip_static on;  # serve prebuilt .gz siblings when the client accepts gzip
    # NB: nginx 1.27's default mime.types already maps .wasm -> application/wasm. Do NOT add a
    # bare `types {}` block here - it REPLACES the whole map and breaks text/html etc.

    # HTML is never cached. index.html carries the content-versioned engine path (e/<hash>/), so a
    # stale copy points at an engine build that may no longer exist - and every client-side fix would
    # reach players only after their browser felt like revalidating. With no Cache-Control at all,
    # browsers fall back to heuristic caching off Last-Modified, which is exactly that failure.
    # NOTE: add_header in a location REPLACES the server-level ones, so the isolation headers are
    # repeated here - without them the engine loses SharedArrayBuffer.
    location = / {
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "no-store" always;
        try_files /launcher.html =404;
    }
    location ~* \.html$ {
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Immutable engine artifacts: cache hard (Cloudflare + browser). Bump filenames or purge
    # the Cloudflare cache on each engine redeploy.
    location ~* \.(wasm|data|js)$ {
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Cloud Locker API. In prod the edge Caddy routes /api/* to ja2-cloud BEFORE this container, so
    # this block is never reached there. Where there is no edge (e.g. the test VM), it lets this
    # nginx front the co-located ja2-cloud container directly, so /api works with no extra proxy.
    # The variable + resolver defer name resolution to request time, so nginx starts even if
    # ja2-cloud isn't up yet (127.0.0.11 is Docker's embedded DNS). Absent that container, /api 502s
    # and the launcher simply hides the Cloud tile - the static game is unaffected.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $ja2_cloud ja2-cloud;
        proxy_pass http://$ja2_cloud:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;    # stream large game-data uploads straight through
        # Cap uploads at the edge too: the backend enforces per-file/per-account quotas, but this
        # stops an oversized body from ever being streamed to it. Keep >= MAX_FILE_BYTES (512m).
        client_max_body_size 512m;
        # A signed-in user could still hammer the API; bound concurrency per client IP so one
        # account can't saturate the upload path. (Zones are defined in the http{} block below.)
        limit_conn ja2_api_conn 8;
        limit_req  zone=ja2_api burst=40 nodelay;
    }

    location / { try_files $uri $uri/ =404; }
}
