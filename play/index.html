<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;font-family:system-ui,sans-serif}
  /* #wrap is a full-viewport clip box; layoutCanvas() absolutely-positions and
     sizes the canvas inside it per screen (native tactical vs. zoomed-to-fill UI). */
  #wrap{position:relative;width:100vw;height:100vh;overflow:hidden}
  canvas{outline:none;display:block;position:absolute;left:0;top:0;image-rendering:auto}
  #fps{position:fixed;right:8px;top:6px;color:#4a4;font:12px monospace;opacity:.7;display:none}
  /* --- Themed loading overlay (matches launcher.html: Arulco black + jungle khaki
     + a low blood-red ember). Covers the canvas during download/boot; fades out on
     the engine's first frame. --- */
  #status{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;background:#0a0a09;color:#ece2c8;
    font:16px/1.6 "Trebuchet MS","Gill Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
    transition:opacity .6s ease}
  #status.hide{opacity:0;pointer-events:none}
  #status::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(150% 74% at 50% 134%, rgba(139,26,26,.34), rgba(198,90,46,.06) 34%, transparent 60%),
      radial-gradient(90% 60% at 50% 136%, rgba(201,165,74,.12), transparent 56%);
    animation:ldEmber 9s ease-in-out infinite}
  @keyframes ldEmber{0%,100%{opacity:.82}50%{opacity:1}}
  #status .ld-inner{position:relative;width:100%;max-width:460px}
  #status .ld-glyph{width:54px;height:54px;margin:0 auto 24px;color:#c9a54a;animation:ldSpin 6s linear infinite}
  #status .ld-glyph svg{width:100%;height:100%;display:block}
  @keyframes ldSpin{to{transform:rotate(360deg)}}
  #status.err .ld-glyph{animation:none;color:#e0836a}
  #status .ld-title{margin:0 0 10px;font-family:"Hoefler Text","Copperplate","Baskerville",Georgia,serif;
    font-weight:700;font-size:clamp(26px,5vw,40px);letter-spacing:.01em;color:#ece2c8;
    text-shadow:0 1px 0 rgba(0,0,0,.6),0 0 34px rgba(201,165,74,.12)}
  #status .ld-title .two{color:#c0392b;text-shadow:0 0 20px rgba(192,57,43,.4)}
  #status .ld-status{margin:0 0 22px;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;
    font-weight:700;color:#c7b070}
  #status .ld-bar{position:relative;height:4px;border-radius:3px;overflow:hidden;background:rgba(138,122,78,.28)}
  #status .ld-fill{height:100%;width:0;border-radius:3px;
    background:linear-gradient(90deg,#8a7a4e,#c9a54a,#eccf7e);transition:width .3s ease}
  #status.indet .ld-fill{width:34%;animation:ldSlide 1.25s ease-in-out infinite}
  @keyframes ldSlide{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}
  #status .sub{margin-top:13px;min-height:16px;font:12px/1.4 ui-monospace,Menlo,monospace;color:#786c58}
  #status.err .ld-status{color:#e0836a}
  @media (prefers-reduced-motion:reduce){
    #status::before,#status .ld-glyph{animation:none}
    #status.indet .ld-fill{animation:none;width:100%}
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></div>
<div id="status" class="indet">
  <div class="ld-inner">
    <div class="ld-glyph" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="24" cy="24" r="15"/>
        <line x1="24" y1="4" x2="24" y2="13"/><line x1="24" y1="35" x2="24" y2="44"/>
        <line x1="4" y1="24" x2="13" y2="24"/><line x1="35" y1="24" x2="44" y2="24"/>
        <circle cx="24" cy="24" r="2.4" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <div class="ld-title">Jagged Alliance <span class="two">2</span></div>
    <div class="ld-status" id="ld-status">Deploying to Arulco…</div>
    <div class="ld-bar"><div class="ld-fill" id="ld-fill"></div></div>
    <div class="sub" id="substatus"></div>
  </div>
</div>
<div id="fps"></div>
<script>
var statusEl = document.getElementById('status');
var subEl = document.getElementById('substatus');
var ldStatusEl = document.getElementById('ld-status');
var ldFillEl = document.getElementById('ld-fill');
// Drive the themed loading overlay from an emscripten status string such as
// "Downloading data... (1234/56789)" - fill the progress bar and show MB.
function setLoading(t){
  if (!t) return;
  var m = t.match(/\((\d+)\/(\d+)\)/);
  if (m && +m[2] > 0){
    statusEl.classList.remove('indet');
    ldFillEl.style.width = Math.max(2, Math.min(100, (+m[1] / +m[2]) * 100)) + '%';
    if (ldStatusEl) ldStatusEl.textContent = 'Loading game data…';
    subEl.textContent = ((+m[1] / 1048576) | 0) + ' / ' + ((+m[2] / 1048576) | 0) + ' MB';
  } else {
    subEl.textContent = t;
  }
}

// Per-screen canvas presentation. The engine runs at ONE global internal
// resolution (the browser size, see computeStartResolution) - but each screen is
// presented differently:
//
//  • BATTLE (tactical, GAME_SCREEN=5): the engine renders the whole framebuffer
//    (the tactical viewport fills the screen minus the HUD bar), so we present the
//    whole framebuffer fit-to-window → native/crisp, more battlefield visible.
//  • Every other screen (menu, laptop, A.I.M., strategic map, save/load…): the
//    engine draws fixed 640x480 art CENTERED in the big framebuffer (STD_SCREEN
//    offset). We zoom that centered 640x480 sub-region up to fill the window, so
//    those screens look exactly as they did at native 640x480 - no black island.
//
// Only the canvas *element's* CSS box changes (framebuffer untouched). SDL2's
// emscripten mouse handler maps  mx = targetX * window->w / cssW ; with the
// UI-zoom box below a click lands on the exact framebuffer pixel the game expects,
// so input is accurate in both modes with no engine change.
var GAME_SCREEN = 5, FADE_SCREEN = 13, MSG_BOX_SCREEN = 14;  // ScreenIDs.h
window.__ja2Screen = (typeof window.__ja2Screen === 'number') ? window.__ja2Screen : 0;
var _fitBusy = false;
function layoutCanvas(){
  var c = document.getElementById('canvas');
  if (!c) return;
  // CRITICAL: put NO CSS size on the canvas until AFTER SDL has created its
  // window. Emscripten_CreateWindow probes the canvas CSS size and, if it already
  // has one (external_size) on a resizable window, sizes the backing store from
  // CSS instead of the requested resolution - a feedback loop that collapses the
  // framebuffer. Gating on the boot flag keeps external_size=false at creation, so
  // the backing store = the resolution we asked for.
  if (!window.__ja2Booted) return;
  var fbW = c.width || 640, fbH = c.height || 480;  // framebuffer SDL set
  var vw = window.innerWidth, vh = window.innerHeight;
  if (!vw || !vh) return;                           // 0x0 (headless) → skip
  var left, top, cssW, cssH;
  if (window.__ja2Screen === GAME_SCREEN){
    // Battle: present whole framebuffer, fit-to-window (letter/pillarbox).
    var s = Math.min(vw / fbW, vh / fbH);
    cssW = fbW * s; cssH = fbH * s;
    left = (vw - cssW) / 2; top = (vh - cssH) / 2;
  } else {
    // Fixed UI: zoom the centered 640x480 sub-region to fill the window.
    var uiX = (fbW - 640) / 2, uiY = (fbH - 480) / 2;
    var z = Math.min(vw / 640, vh / 480);
    var offX = (vw - 640 * z) / 2, offY = (vh - 480 * z) / 2;
    cssW = fbW * z; cssH = fbH * z;
    left = offX - uiX * z; top = offY - uiY * z;
  }
  _fitBusy = true;
  c.style.setProperty('width',  cssW + 'px', 'important');
  c.style.setProperty('height', cssH + 'px', 'important');
  c.style.setProperty('left',   left + 'px', 'important');
  c.style.setProperty('top',    top  + 'px', 'important');
  _fitBusy = false;
}
// onGameReady still calls fitCanvas() - keep the name as an alias.
function fitCanvas(){ layoutCanvas(); }
window.addEventListener('resize', layoutCanvas);
(function watchCanvas(){
  var c = document.getElementById('canvas');
  if (!c) return;
  // SDL resets the framebuffer/style when it creates the window; re-layout then.
  try { new MutationObserver(function(){ if (!_fitBusy) layoutCanvas(); })
        .observe(c, { attributes:true, attributeFilter:['style','width','height'] }); } catch(e){}
})();
setInterval(layoutCanvas, 500);
// The engine (ja2_pump_frame) calls this on every screen change. Overlay/transition
// screens (message box, fade) keep the current presentation mode so a dialog over
// the battle screen doesn't suddenly zoom the whole view.
window.__ja2SetScreen = function(screen){
  if (screen === FADE_SCREEN || screen === MSG_BOX_SCREEN) return;  // keep mode
  var wasBattle = window.__ja2Screen === GAME_SCREEN;
  var isBattle  = screen === GAME_SCREEN;
  window.__ja2Screen = screen;
  if (isBattle !== wasBattle) layoutCanvas();  // only re-layout on mode change
};

// Starting internal resolution, written into ja2.json's `res` at boot (JA2 can't
// change resolution at runtime). layoutCanvas() then presents per-screen.
//
// DEFAULT = the browser window size: the tactical/battle screen renders at full
// resolution (native, more battlefield visible), while layoutCanvas() zooms the
// fixed 640x480 art screens (menu, laptop, A.I.M., map…) back up to fill so they
// look exactly as before.
//
//   ?res=classic  old behavior: 640x480 everywhere, upscaled to fill.
//   ?res=WxH      pin a specific internal resolution.
//   ?res=window   force browser-window size (same as default).
var DEFAULT_RES = '640x480';
// Cap the internal resolution so an oversized window doesn't make JA2's per-frame
// software surface blits expensive. Adjustable.
var MAX_RES_W = 2560, MAX_RES_H = 1440;
function windowRes(){
  var vw = window.innerWidth, vh = window.innerHeight;
  if (!vw || !vh) return DEFAULT_RES;                        // 0x0 (headless) → safe default
  vw = Math.max(640, Math.min(MAX_RES_W, vw));
  vh = Math.max(480, Math.min(MAX_RES_H, vh));
  return (vw - vw % 2) + 'x' + (vh - vh % 2);
}
function computeStartResolution(){
  var m = (location.search.match(/[?&]res=(\d+)x(\d+)/i));
  if (m) return Math.max(640, +m[1]) + 'x' + Math.max(480, +m[2]);
  if (/[?&]res=classic\b/.test(location.search)) return DEFAULT_RES;  // old 640x480 everywhere
  if (/[?&]res=window\b/.test(location.search)) return windowRes();
  return windowRes();                                                 // default: browser size
}

// Pre-create the Web Audio context BEFORE SDL opens audio. SDL2's emscripten
// backend reuses Module.SDL2.audioContext if it already exists (else it calls a
// bare `new AudioContext()`, which on some devices yields a low-latency
// "interactive" context bound to a degraded mono / low-sample-rate device path -
// audio comes out garbled and blaring). Requesting a 48 kHz 'playback' context
// (what media players use) routes game audio through the browser's normal
// high-quality resampler regardless of the hardware device rate. SoundMan reads
// back this context's sample rate, so decoders target it correctly.
// A mono (1-channel) output device - e.g. a Bluetooth headset in hands-free/HFP
// mode - leaves the AudioContext destination in an INVALID state: channelCount=2
// (default stereo) with channelCountMode 'explicit' but maxChannelCount=1. The
// engine's stereo output is then forced through a 1-channel device, which comes
// out garbled/clipped. Clamp the destination to the device's real channel count
// so the 2→1 downmix is well-defined and clean. No-op on a normal stereo device.
function clampDestChannels(ctx){
  try {
    var d = ctx && ctx.destination;
    if (d && d.maxChannelCount >= 1 && d.channelCount > d.maxChannelCount) {
      d.channelCount = d.maxChannelCount;
    }
  } catch(e){}
}
function presetAudioContext(){
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    var ctx;
    try { ctx = new AC({ latencyHint: 'playback', sampleRate: 48000 }); }
    catch(e){ ctx = new AC({ latencyHint: 'playback' }); }   // some devices reject a forced rate
    clampDestChannels(ctx);
    Module.SDL2 = Module.SDL2 || {};
    Module.SDL2.audioContext = ctx;
    console.log('ja2 audio ctx:', ctx.sampleRate, 'Hz, maxCh',
                ctx.destination && ctx.destination.maxChannelCount);
  } catch(e){ console.warn('audio ctx preset failed:', e); }
}

// --- Folder-backed saves (?src=local) -----------------------------------------------------------
// Mirror JA2's saved games to/from a dedicated ja2-web-saves subfolder INSIDE the player's chosen
// folder, so saves live ON DISK and survive clearing browser data (like the desktop game). The folder
// is the authoritative copy; IDBFS is just a working cache. JA2 writes saves to <home>/.ja2/SavedGames
// (SAVED_GAME_DIR under the stracciatella home) - here HOME=/userdata, so /userdata/.ja2/SavedGames.
var __folderSaves = null, __mirrored = {}, __mirroring = false, __mirrorAgain = false;
var __JA2_SAVES = '/userdata/.ja2/SavedGames';
async function setupFolderSaves(dir){
  if (!dir) return;
  var perm='prompt'; try { perm = await dir.queryPermission({mode:'readwrite'}); } catch(e){}
  if (perm !== 'granted'){ try { perm = await dir.requestPermission({mode:'readwrite'}); } catch(e){} }
  if (perm !== 'granted'){ console.warn('[saves] folder is read-only - saves stay in browser storage this session'); return; }
  var sh; try { sh = await dir.getDirectoryHandle('ja2-web-saves', {create:true}); }
  catch(e){ console.warn('[saves] could not open ja2-web-saves in your folder', e); return; }
  try { FS.mkdirTree(__JA2_SAVES); } catch(e){}
  var loaded=0;                                       // mirror IN: folder -> MEMFS (folder wins)
  try { for await (const [name,h] of sh.entries()){
    if (h.kind!=='file') continue;
    try { var buf=new Uint8Array(await (await h.getFile()).arrayBuffer());
          FS.writeFile(__JA2_SAVES+'/'+name, buf);
          try { __mirrored[name]=FS.stat(__JA2_SAVES+'/'+name).mtime.getTime(); } catch(_){}
          loaded++; }
    catch(e){ console.warn('[saves] loading '+name+' failed', e); }
  } } catch(e){ console.warn('[saves] could not read your saves folder', e); }
  __folderSaves = { dir: dir, saves: sh };
  console.log('[saves] '+(loaded?('loaded '+loaded+' save(s) from'):'saving to')+' ja2-web-saves in your folder (on disk, not the browser)');
  try { window.__ja2Sync(); } catch(e){}
}
// mirror OUT: MEMFS -> folder. Only files whose mtime changed since last mirror; reflects deletions.
async function mirrorSavesToFolder(){
  if (!__folderSaves || __mirroring){ if(__folderSaves) __mirrorAgain=true; return; }
  __mirroring=true;
  var sh=__folderSaves.saves, live={};
  try {
    var names=[]; try { names=FS.readdir(__JA2_SAVES).filter(function(n){ return n!=='.'&&n!=='..'; }); } catch(e){}
    for (var i=0;i<names.length;i++){
      var n=names[i], st; try { st=FS.stat(__JA2_SAVES+'/'+n); if(!FS.isFile(st.mode)) continue; } catch(e){ continue; }
      live[n]=1; var mt=st.mtime.getTime();
      if (__mirrored[n]===mt) continue;
      try { var data=FS.readFile(__JA2_SAVES+'/'+n);
            var fh=await sh.getFileHandle(n,{create:true});
            var w=await fh.createWritable(); await w.write(data); await w.close();
            __mirrored[n]=mt; }
      catch(e){ console.warn('[saves] writing '+n+' to your folder failed', e); }
    }
    for (var d in __mirrored){ if(!live[d]){ try { await sh.removeEntry(d); } catch(e){} delete __mirrored[d]; } }
  } catch(e){ console.warn('[saves] mirror to folder failed', e); }
  __mirroring=false;
  if (__mirrorAgain){ __mirrorAgain=false; mirrorSavesToFolder(); }
}
window.__mirrorSaves = mirrorSavesToFolder;

// ?src=local: copy the player's OWN Jagged Alliance 2 "Data" folder (picked in
// launcher.html and remembered as a FileSystemDirectoryHandle) into MEMFS at
// /owndata/data. The engine's VFS then reads the SLF archives from there
// (game_dir=/owndata) - no bundled data package is loaded in this mode. Returns
// the launcher's stored meta ({resversion, wildfire}); throws a user-facing
// message on failure so the caller can bounce back to the chooser.
async function mountOwnDataFolder(){
  function ljOpen(){ return new Promise(function(res,rej){
    var r = indexedDB.open('ja2-launcher',1);
    r.onupgradeneeded=function(){ if(!r.result.objectStoreNames.contains('handles')) r.result.createObjectStore('handles'); };
    r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); };
  }); }
  function ljGet(key){ return ljOpen().then(function(db){ return new Promise(function(res,rej){
    var t=db.transaction('handles','readonly').objectStore('handles').get(key);
    t.onsuccess=function(){ res(t.result); }; t.onerror=function(){ rej(t.error); };
  }); }); }

  var dir = await ljGet('ja2data');
  var meta = (await ljGet('ja2meta')) || {};
  if (!dir) throw new Error('No folder was remembered');
  window.__ja2Dir = dir;                              // handed to setupFolderSaves for on-disk saves
  var perm='prompt';
  try { perm = await dir.queryPermission({mode:'read'}); } catch(e){}
  if (perm !== 'granted'){
    try { perm = await dir.requestPermission({mode:'read'}); } catch(e){}
    if (perm !== 'granted') throw new Error('Read permission is not granted');
  }

  // Users may pick the install root or the Data folder itself - descend if present.
  var dataDir = dir;
  for await (const ent of dir.entries())
    if (ent[1].kind==='directory' && ent[0].toLowerCase()==='data'){ dataDir = ent[1]; break; }

  addRunDependency('ja2-owndata');
  try {
    try { FS.mkdirTree('/owndata/data'); } catch(e){}
    var files=0, bytes=0, slf=0;
    async function walk(handle, prefix){
      var entries=[];
      for await (const ent of handle.entries()) entries.push(ent);
      for (const ent of entries){                 // subdirs first (TILECACHE/, stsounds/ …)
        if (ent[1].kind==='directory'){
          var rd = prefix ? prefix+'/'+ent[0] : ent[0];
          try { FS.mkdirTree('/owndata/data/'+rd); } catch(e){}
          await walk(ent[1], rd);
        }
      }
      for (const ent of entries){
        if (ent[1].kind!=='file') continue;
        var rel = prefix ? prefix+'/'+ent[0] : ent[0];
        var file = await ent[1].getFile();
        var buf = new Uint8Array(await file.arrayBuffer());
        FS.writeFile('/owndata/data/'+rel, buf);
        files++; bytes += buf.length; if (/\.slf$/i.test(ent[0])) slf++;
        if (subEl) subEl.textContent = 'Loading your JA2 data… '+files+' files, '+((bytes/1048576)|0)+' MB';
      }
    }
    await walk(dataDir, '');
    if (slf===0) throw new Error('No .slf data archives were found in that folder');
    console.log('own-data: copied '+files+' files ('+((bytes/1048576)|0)+' MB, '+slf+' SLF) → /owndata/data');
  } finally {
    removeRunDependency('ja2-owndata');
  }
  return meta;
}

// ?src=cloud: same shape as mountOwnDataFolder, but the source is the user's own JA2 data uploaded
// to their private S3 prefix (Cloud Locker). The backend returns a manifest of {path,size} with a
// presigned GET url per file; we stream each into the SAME MEMFS target (/owndata/data), so the
// engine reads it identically. Requires a signed-in session cookie + bucket CORS for our origin.
async function mountCloudData(){
  var r = await fetch('/api/data/manifest', { credentials:'same-origin' });
  if (r.status === 401) throw new Error('Not signed in to the Cloud Locker');
  if (!r.ok) throw new Error('Cloud storage is unavailable');
  var files = (await r.json()).files || [];
  if (!files.length) throw new Error('No JA2 data has been uploaded to your Cloud Locker yet');
  addRunDependency('ja2-clouddata');
  try {
    try { FS.mkdirTree('/owndata/data'); } catch(e){}
    var done=0, bytes=0, slf=0, total=files.length;
    for (var i=0;i<files.length;i++){
      var f = files[i], rel = f.path;
      var slash = rel.lastIndexOf('/');
      if (slash > 0){ try { FS.mkdirTree('/owndata/data/'+rel.slice(0,slash)); } catch(e){} }
      var fr = await fetch(f.url, { mode:'cors' });
      if (!fr.ok) throw new Error('Download failed for '+rel+' ('+fr.status+')');
      var buf = new Uint8Array(await fr.arrayBuffer());
      FS.writeFile('/owndata/data/'+rel, buf);
      done++; bytes += buf.length; if (/\.slf$/i.test(rel)) slf++;
      if (subEl) subEl.textContent = 'Downloading your Cloud Locker… '+done+'/'+total+' files, '+((bytes/1048576)|0)+' MB';
    }
    if (slf===0) throw new Error('Your Cloud Locker has no .slf data archives');
    console.log('cloud-data: downloaded '+done+' files ('+((bytes/1048576)|0)+' MB, '+slf+' SLF) → /owndata/data');
  } finally {
    removeRunDependency('ja2-clouddata');
  }
  return {};
}

// --- Cloud save sync (?src=cloud) --------------------------------------------------------------
// Parallel to the folder-saves mirror, against S3 via presigned URLs. S3 is the authoritative copy;
// IDBFS is the working cache. Mirror IN at boot (remote -> MEMFS), mirror OUT on __ja2Sync (changed
// files -> presigned PUT; removed files -> presigned DELETE), coalesced exactly like the folder path.
var __cloudSaves = false, __cloudMirrored = {}, __cloudBusy = false, __cloudAgain = false;
async function setupCloudSaves(){
  try { FS.mkdirTree(__JA2_SAVES); } catch(e){}
  var loaded=0;
  try {
    var r = await fetch('/api/saves', { credentials:'same-origin' });
    if (!r.ok) throw new Error('list '+r.status);
    var saves = (await r.json()).saves || [];
    for (var i=0;i<saves.length;i++){
      var name = saves[i].name; if (!name || name.indexOf('/')>=0) continue;
      try {
        var pr = await fetch('/api/saves/presign', { method:'POST', credentials:'same-origin',
          headers:{'content-type':'application/json'}, body: JSON.stringify({ name: name, op:'get' }) });
        var url = (await pr.json()).url;
        var fr = await fetch(url, { mode:'cors' }); if (!fr.ok) continue;
        FS.writeFile(__JA2_SAVES+'/'+name, new Uint8Array(await fr.arrayBuffer()));
        try { __cloudMirrored[name]=FS.stat(__JA2_SAVES+'/'+name).mtime.getTime(); } catch(_){}
        loaded++;
      } catch(e){ console.warn('[cloud-saves] loading '+name+' failed', e); }
    }
  } catch(e){ console.warn('[cloud-saves] could not list your cloud saves', e); }
  __cloudSaves = true;
  console.log('[cloud-saves] '+(loaded?('loaded '+loaded+' save(s) from'):'syncing to')+' your Cloud Locker');
  try { window.__ja2Sync(); } catch(e){}
}
async function mirrorSavesToCloud(){
  if (!__cloudSaves) return;
  if (__cloudBusy){ __cloudAgain=true; return; }
  __cloudBusy=true;
  var live={};
  try {
    var names=[]; try { names=FS.readdir(__JA2_SAVES).filter(function(n){ return n!=='.'&&n!=='..'; }); } catch(e){}
    for (var i=0;i<names.length;i++){
      var n=names[i], st; try { st=FS.stat(__JA2_SAVES+'/'+n); if(!FS.isFile(st.mode)) continue; } catch(e){ continue; }
      live[n]=1; var mt=st.mtime.getTime();
      if (__cloudMirrored[n]===mt) continue;
      try {
        var data = FS.readFile(__JA2_SAVES+'/'+n);
        // Size up front: the server quota-checks it and (in S3 mode) binds it into the signed URL.
        var pr = await fetch('/api/saves/presign', { method:'POST', credentials:'same-origin',
          headers:{'content-type':'application/json'}, body: JSON.stringify({ name:n, op:'put', size:data.length }) });
        if (!pr.ok){ console.warn('[cloud-saves] '+n+' rejected ('+pr.status+') - not retrying this cycle');
                     __cloudMirrored[n]=mt; continue; }   // remember it so we don't hammer the API
        var url = (await pr.json()).url;
        var put = await fetch(url, { method:'PUT', mode:'cors', body: data });
        if (put.ok) __cloudMirrored[n]=mt;
      } catch(e){ console.warn('[cloud-saves] uploading '+n+' failed', e); }
    }
    for (var d in __cloudMirrored){ if(!live[d]){
      try { var pr2 = await fetch('/api/saves/presign', { method:'POST', credentials:'same-origin',
              headers:{'content-type':'application/json'}, body: JSON.stringify({ name:d, op:'delete' }) });
            await fetch((await pr2.json()).url, { method:'DELETE', mode:'cors' }); } catch(e){}
      delete __cloudMirrored[d];
    } }
  } catch(e){ console.warn('[cloud-saves] mirror to cloud failed', e); }
  __cloudBusy=false;
  if (__cloudAgain){ __cloudAgain=false; mirrorSavesToCloud(); }
}

// --- Content-versioned engine path. The build stamps __ENGINE_VERSION__ with a hash of ja2.wasm and
// moves ja2.{js,wasm,data} into e/<hash>/, so every build's engine files live at a UNIQUE path.
// Cloudflare therefore can NEVER serve a mismatched mix of two builds' files (a mismatched loader/wasm
// pair calls unlinked function pointers → "null function" at boot). Unstamped (local/git) → flat paths.
var __ENGINE_VER = "__ENGINE_VERSION__";
var __ENGINE_DIR = (__ENGINE_VER.charAt(0) === "_") ? "" : ("e/" + __ENGINE_VER + "/");
var Module = {
  // ja2.wasm, ja2.data AND the pthread-worker ja2.js all resolve through locateFile → versioned dir.
  locateFile: function(path){ return __ENGINE_DIR + path; },
  canvas: document.getElementById('canvas'),
  arguments: /[?&]editor\b/.test(location.search) ? ['-editor'] : [],
  print: function(t){ console.log(t); },
  printErr: function(t){ console.warn(t); },
  setStatus: function(t){ setLoading(t); },
  preRun: [presetAudioContext, function(){
    // Persistent home: config (~/.ja2), ja2.json, savegames all live here.
    ENV.HOME = '/userdata';
    ENV.TMPDIR = '/userdata/.ja2'; // ja2.log lands here → visible in launcher Logs tab, persisted
    FS.mkdir('/userdata');
    FS.mount(IDBFS, {}, '/userdata');
    addRunDependency('idbfs-restore');
    FS.syncfs(true, function(err){
      if (err) console.warn('IDBFS restore failed', err);
      try { FS.mkdir('/userdata/.ja2'); } catch(e){}
      (async function(){
        // Merge any launcher-written config.
        var cfg = {};
        try {
          var txt = new TextDecoder().decode(FS.readFile('/userdata/.ja2/ja2.json'))
                      .replace(/^\s*\/\/.*$/gm, '');           // ja2.json allows // comments
          cfg = JSON.parse(txt);
        } catch(e){}

        // Data source: ?src=local mounts the player's own JA2 folder; otherwise
        // the bundled sample package supplies /game/gamedata.
        var srcLocal = /[?&]src=local\b/.test(location.search);
        var srcCloud = /[?&]src=cloud\b/.test(location.search);
        if (srcLocal || srcCloud){
          try {
            var meta = srcCloud ? await mountCloudData() : await mountOwnDataFolder();
            cfg.game_dir = '/owndata';
            if (meta && meta.resversion) cfg.resversion = meta.resversion;
            // Wire saves <-> the engine so saved games persist. IDBFS is already loaded here (we're
            // inside its syncfs(true) callback), so no reconcile race. Cloud mirrors to S3; local
            // mirrors to the ja2-web-saves folder on disk (needs the read-write grant).
            if (srcCloud){ try { await setupCloudSaves(); } catch(e){ console.warn('[cloud-saves] setup skipped', e); } }
            else { try { await setupFolderSaves(window.__ja2Dir); } catch(e){ console.warn('[saves] setup skipped', e); } }
          } catch(e){
            console.error((srcCloud?'cloud':'own')+'-data mount failed', e);
            statusEl.classList.remove('hide', 'indet');
            statusEl.classList.add('err');
            if (ldStatusEl) ldStatusEl.textContent = srcCloud ? 'Could not load your Cloud Locker' : 'Could not read your JA2 folder';
            subEl.textContent = (e && e.message || e) + ' - returning to the chooser…';
            setTimeout(function(){ location.href = 'launcher.html'; }, 2600);
            return;   // leave idbfs-restore held: never half-boot with no data
          }
        } else if (!cfg.game_dir || cfg.game_dir === '/owndata' || cfg.game_dir.indexOf('/some/place') === 0){
          // bundled sample (default). Reset a stale /owndata from a prior local run.
          cfg.game_dir = '/game/gamedata';
        }

        cfg.res = computeStartResolution();
        // JA2's default "PERFECT" (pixel-perfect) scaling hard-errors when the
        // game resolution exceeds the desktop/display size - which our auto-res
        // routinely does. LINEAR scales any size cleanly, so it's the browser default.
        if (!cfg.scaling) cfg.scaling = 'LINEAR';
        FS.writeFile('/userdata/.ja2/ja2.json', JSON.stringify(cfg, null, 2));
        console.log('ja2 start:', cfg.game_dir, cfg.res, cfg.resversion || 'ENGLISH');
        removeRunDependency('idbfs-restore');
      })();
    });
  }],
  onRuntimeInitialized: function(){},
  // A clean quit (the Quit menu, the window-close/SDL_QUIT event, or the game
  // calling exit()) tears the runtime down and would leave a dead black tab.
  // In the browser we'd rather restart: reload the page so the game boots back
  // to the main menu. Saves/config already persisted to IndexedDB, so nothing
  // is lost. onAbort (a fatal error) is handled separately below - no reload
  // loop there.
  onExit: function(){ restartGame('quit'); },
  onAbort: function(what){
    statusEl.classList.remove('hide', 'indet');
    statusEl.classList.add('err');
    var haveData = false;
    try { FS.stat('/game/gamedata/data'); haveData = true; } catch(e){}
    try { FS.stat('/owndata/data'); haveData = true; } catch(e){}
    if (ldStatusEl) ldStatusEl.textContent = haveData ? 'Aborted' : 'Game data not found';
    subEl.textContent = haveData
      ? String(what || 'an unexpected error occurred')
      : 'The JA2 Data/*.slf archives could not be loaded.';
  }
};

// Restart the game by reloading the page. Flush saves first, and guard against
// a reload loop (if the game quits again within a few seconds of starting,
// stop and show a message instead of looping forever).
var _restarting = false;
function restartGame(reason){
  if (_restarting) return;
  _restarting = true;
  try { FS.syncfs(false, function(){ doReload(); }); } catch(e){ doReload(); }
  function doReload(){
    try {
      var last = +sessionStorage.getItem('ja2_restart_ts') || 0;
      var n = (+sessionStorage.getItem('ja2_restart_n') || 0);
      var now = Date.now();
      if (now - last < 4000){ n++; } else { n = 0; }
      sessionStorage.setItem('ja2_restart_ts', String(now));
      sessionStorage.setItem('ja2_restart_n', String(n));
      if (n >= 3){                                   // looping - stop
        sessionStorage.removeItem('ja2_restart_n');
        statusEl.style.display = '';
        statusEl.innerHTML = 'Game exited (' + reason + ').<div class="sub">Reload the page to play again.</div>';
        return;
      }
    } catch(e){}
    location.reload();
  }
}

// Flush saves/config to IndexedDB. Called on interval, tab-hide, and by the game after saves.
window.__ja2Sync = function(){ try { FS.syncfs(false, function(){}); } catch(e){} try { mirrorSavesToFolder(); } catch(e){} try { mirrorSavesToCloud(); } catch(e){} };
setInterval(window.__ja2Sync, 15000);
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'hidden') window.__ja2Sync();
});
addEventListener('pagehide', function(){ window.__ja2Sync(); });

// Web Audio needs a user gesture to start. Audio here is owned by SDL2's
// emscripten driver (miniaudio is used only as a codec, with MA_NO_DEVICE_IO),
// so the SDL2 AudioContext is the only one to resume.
function resumeAudio(){
  try {
    var ctx = Module.SDL2 && Module.SDL2.audioContext;
    if (ctx){ clampDestChannels(ctx); if (ctx.state === 'suspended') ctx.resume(); }
    // AudioWorklet backend (default): the engine exposes its context here.
    var wctx = window.__ja2AudioCtx;
    if (wctx && wctx.state === 'suspended') wctx.resume();
  } catch(e){}
}
addEventListener('click', resumeAudio);
addEventListener('keydown', resumeAudio);

// ---- Main-loop pump (CS-Web pattern) ----
// MessageChannel messages are not throttled in hidden tabs; RAF paces us to
// vsync when visible. The C++ side self-limits game cycles to 144Hz.
var pumpStarted = false;
window.__pumpErrors = 0;
function startPump(){
  if (pumpStarted) return;
  pumpStarted = true;
  statusEl.classList.add('hide');   // fade the themed loading overlay out
  var mc = new MessageChannel();
  var scheduled = false;
  var frames = 0, lastT = performance.now();
  var fpsEl = document.getElementById('fps');
  function scheduleNext(){
    if (scheduled) return;
    scheduled = true;
    // Visible: pace to vsync via RAF. Hidden: RAF is throttled/stopped by the
    // browser, so drive via MessageChannel - but cap to ~120Hz with a timer so
    // a backgrounded tab keeps running without pinning a CPU core (RAF would
    // give 0fps; a bare postMessage loop gave ~200k fps).
    if (document.hidden) setTimeout(function(){ mc.port2.postMessage(0); }, 8);
    else requestAnimationFrame(function(){ mc.port2.postMessage(0); });
  }
  // ?perf: rolling frame-time stats over the last 600 pump calls, exposed as
  // window.__ja2FrameStats = {n, avg, p95, max} (ms). Zero cost when absent.
  var perfOn = /[?&]perf\b/.test(location.search);
  var perfBuf = perfOn ? [] : null;
  function perfRecord(dt){
    perfBuf.push(dt);
    if (perfBuf.length > 600) perfBuf.shift();
    var s = perfBuf.slice().sort(function(a,b){ return a-b; });
    var sum = 0; for (var i = 0; i < s.length; i++) sum += s[i];
    window.__ja2FrameStats = {
      n: s.length,
      avg: +(sum / s.length).toFixed(3),
      p95: +s[Math.floor(s.length * 0.95)].toFixed(3),
      max: +s[s.length - 1].toFixed(3),
    };
  }
  mc.port1.onmessage = function(){
    scheduled = false;
    try {
      if (perfOn){
        var t0 = performance.now();
        Module._ja2_pump_frame();
        perfRecord(performance.now() - t0);
      } else {
        Module._ja2_pump_frame();
      }
    }
    catch(e){
      // The game called exit() (Quit menu / SDL_QUIT). Emscripten unwinds the
      // pump call with an ExitStatus; restart instead of ending the tab.
      if (e && (e.name === 'ExitStatus' || /ExitStatus/.test(String(e)))){
        restartGame('exit');
        return; // stop pumping; restartGame reloads
      }
      if (++window.__pumpErrors > 3){
        console.error('pump stopped after repeated errors', e);
        restartGame('error');
        return; // do not reschedule
      }
      console.error('pump error', e);
    }
    frames++;
    var now = performance.now();
    if (now - lastT > 1000){
      fpsEl.textContent = frames + ' fps';
      frames = 0; lastT = now;
    }
    scheduleNext();
  };
  mc.port2.postMessage(0);
}

// The game calls Module.onGameReady from MainLoop() once init succeeded;
// only then is it safe to pump. If main() bails early we show its error.
Module.onGameReady = function(){ window.__ja2Booted = true; startPump(); layoutCanvas(); };
</script>
<script>
// Data source depends on how the chooser (launcher.html) sent us here:
//  • ?src=local - the player's own JA2 "Data" folder is copied into MEMFS in
//    preRun; no bundled package is loaded (that's the whole point - no download).
//  • default - load the bundled sample data package. It hooks
//    Module.addRunDependency, so it MUST run before ja2.js.
(function(){
  function load(src, cb, errCb){ var s=document.createElement('script'); s.src=src; if(cb) s.onload=cb; if(errCb) s.onerror=errCb; document.body.appendChild(s); }
  var s = location.search;
  if (/[?&]src=local\b/.test(s)) load(__ENGINE_DIR + 'ja2.js');   // own folder (mounted in preRun)
  else load('ja2-gamedata.js', function(){ load(__ENGINE_DIR + 'ja2.js'); }, // default → full bundled sample
    function(){
      // Production is upload-only: no bundled data package is deployed, so any
      // non-src=local entry can't boot. Send the visitor to the chooser instead
      // of hanging forever on the loading screen.
      var el = document.getElementById('ld-status');
      if (el) el.textContent = 'No bundled game data here - taking you to the chooser…';
      setTimeout(function(){ location.href = 'launcher.html'; }, 1800);
    });
})();
</script>
</body>
